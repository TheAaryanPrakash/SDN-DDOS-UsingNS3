# Publishes the interactive demo + full write-up (index.html, plus the result
# graphs it embeds) to GitHub Pages. Uses the GitHub Actions deployment flow
# and enables Pages automatically on the first run, so no manual
# Settings -> Pages toggle is needed.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site (index.html + result graphs)
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -r graphs _site/graphs

      - name: Configure Pages (enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
